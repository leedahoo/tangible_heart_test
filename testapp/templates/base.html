{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}질문 페이지{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/landing.css' %}?v=4">
</head>
<body>

  <!-- 배경 (홈과 동일하게) -->
  <div class="bg-wrapper">
    <div class="bg-fixed" style="--bg:url('{% static 'images/landing_bg.png' %}')"></div>
  </div>

  <!-- 실제 내용 -->
  <div class="content">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
