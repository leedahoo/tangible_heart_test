<!-- templates/question_4.html -->
{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>질문 4</title>
  <link rel="stylesheet" href="{% static 'css/landing.css' %}?v=5">
  <style>
    .q-wrap {
      position: relative;
      z-index: 1;             
      max-width: 1000px;
      margin-top: -200vh;
      transform: translateX(7%);
      text-align: left;
      color: #222;
    }
    .q-wrap h2 { font-size: 2.5rem; margin: 0 0 16px; }
    .q-wrap p  { font-size: 1.5rem; margin: 0 0 24px; }
    .q-wrap button{
      padding: 12px 20px; font-size: 1.2rem; margin: 8px 0;
      border: none; border-radius: 8px; cursor: pointer; background: #f2f2f2;
    }
    .q-wrap button:hover{ background:#e6e6e6; }
  </style>
</head>
<body>
  <div class="bg-wrapper">
    <div class="bg-fixed" style="--bg:url('{% static 'images/landing_bg.png' %}')"></div>
  </div>

  <div class="q-wrap">
    <h2>질문 4:</h2>
    <p>문제를 해결할 때 더 의지하는 것은?</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" name="answer" value="A">A. 데이터와 근거, 논리적 분석</button><br><br>
      <button type="submit" name="answer" value="B">B. 사람들의 분위기와 관계, 상황 맥락</button><br><br>
      <button type="submit" name="answer" value="C">C. 직감과 패턴 감지, 감(感)</button>
      <!-- form 종료 직전 -->
</form>

<!-- 뒤로가기 버튼 -->
<div style="margin-top: 20px;">
  <a href="{% url 'question_3' %}" 
     style="display:inline-block; padding: 10px 16px; font-size:1rem; background:#ccc; color:#000; border-radius:8px; text-decoration:none;">
    ← 뒤로가기
  </a>
</div>
    </form>
  </div>
</body>
</html>
