{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>질문 1</title>
  <link rel="stylesheet" href="{% static 'css/landing.css' %}?v=5">
  <style>
    /* 질문 영역 래퍼 */
    .q-wrap {
      position: relative;
      z-index: 1;             
      max-width: 1000px;

      /* 세로 위치 조절 */
      margin-top: -200vh; /* 위로 올림 */

      /* 가로 위치 조절 */
      transform: translateX(7%);

      text-align: left;
      color: #222;
    }

    /* 제목 글자 크기 */
    .q-wrap h2 {
      font-size: 2.5rem; /* 기존 2rem → 크게 */
      margin: 0 0 16px;
    }

    /* 질문 문장 글자 크기 */
    .q-wrap p {
      font-size: 1.5rem; /* 기존 1.2rem → 크게 */
      margin: 0 0 24px;
    }

    /* 버튼 글자 크기 + 스타일 */
    .q-wrap button {
      padding: 12px 20px;
      font-size: 1.2rem; /* 기존 1rem → 크게 */
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #f2f2f2;
    }

    .q-wrap button:hover {
      background: #e6e6e6;
    }
  </style>
</head>
<body>
  <!-- 배경 -->
  <div class="bg-wrapper">
    <div class="bg-fixed" style="--bg:url('{% static 'images/landing_bg.png' %}')"></div>
  </div>

  <!-- 질문 컨텐츠 -->
  <div class="q-wrap">
    <h2>질문 1:</h2>
    <p>친한 친구가 고민을 털어놓을 때 당신은?</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" name="answer" value="A">A. 먼저 해결책을 제안한다</button><br><br>
      <button type="submit" name="answer" value="B">B. 공감하고 들어준다</button><br><br>
      <button type="submit" name="answer" value="C">C. 거리 두며 듣는다</button>
    </form>
  </div>
</body>
</html>
