{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>결과</title>
  <link rel="stylesheet" href="{% static 'css/landing.css' %}?v=5">
  <style>
    /* 이미지 크기 조절 */
    .result-img {
      width: 500px; /* 원하는 크기 */
      height: auto; /* 비율 유지 */
    }

    /* 결과 내용 래퍼 */
    .result-wrap {
      position: relative;
      z-index: 1;             /* 필요시 배경 위에 오도록 */
      max-width: 1000px;

      /* 🔧 위치 조절 */
      margin: 8vh auto 0;      /* 화면 상단에서 8vh 띄움 */
      text-align: center;
      color: #222;
    }

    .result-wrap h2 {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }

    .result-wrap p {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .result-wrap button {
      padding: 12px 20px;
      font-size: 1.2rem;
      margin: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #f2f2f2;
    }

    .result-wrap button:hover {
      background: #e6e6e6;
    }
  </style>
</head>
<body>

  <!-- ✅ 결과 내용 -->
  <div class="result-wrap">
    <h2>당신의 결과 유형은:</h2>

    {% if result_type == "unknown" %}
      <p>죄송합니다. 결과를 찾을 수 없습니다.</p>
    {% else %}
      <p><strong>{{ result_type }}</strong></p>
      <img src="{% static 'characters/'|add:result_type|add:'.png' %}" 
           alt="캐릭터 이미지" 
           class="result-img">
      <br><br>
      <button onclick="window.print()">결과 이미지 출력하기</button>
    {% endif %}

    <!-- 다시 시작하기 -->
    <form method="post" action="{% url 'reset' %}" style="margin-top:16px;">
      {% csrf_token %}
      <button type="submit">다시 시작하기</button>
    </form>
  </div>

</body>
</html>
